<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a25"><title>Critter Rescue • Hambone Arcade</title><style>*{box-sizing:border-box} :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111d20;color:#f1f2d9}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#34483c,#101c21 75%)}button,select{font:inherit;color:inherit;background:#233c37;border:1px solid #527266;border-radius:10px;padding:9px 12px;cursor:pointer;touch-action:manipulation}button:hover{background:#36564b}button:disabled{opacity:.35;cursor:default}button[aria-pressed=true]{background:#e2c785;color:#26372e;border-color:#fff0bd}header{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:auto;padding:12px 14px 5px}h1{font-size:clamp(19px,4vw,29px);margin:0;letter-spacing:-.05em;color:#f8e5a7}header small{font-size:10px;letter-spacing:.18em;color:#a8c4b3}a{color:#d7e7bb;text-decoration:none}main{max-width:1100px;margin:auto;padding:7px 12px 26px}.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.title{font-weight:800}.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#c3dac5;font-variant-numeric:tabular-nums}.stats strong{color:#fff0ba;font-size:16px}.frame{position:relative;border:1px solid #729087;border-radius:14px;overflow:hidden;background:#202f2e;box-shadow:0 12px 35px #0008}.viewport{overflow:auto;overscroll-behavior:contain;max-width:100%;line-height:0}canvas{width:100%;height:auto;display:block;touch-action:none;image-rendering:auto}.toolbar{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}.tool{min-width:87px;display:grid;gap:1px;text-align:left;font-size:12px}.tool b{font-size:19px}.tool span{font-size:10px;opacity:.85}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.primary{background:#d8bb75;color:#23332a;font-weight:800}.hint{font-size:13px;color:#c5d5c0;margin:6px 0 10px;line-height:1.4}.result{position:absolute;inset:0;display:grid;place-items:center;background:#111d20bb;line-height:1.4;padding:12px}.result[hidden]{display:none}.panel{max-width:350px;text-align:center;background:#263b32;border:1px solid #b9d19c;padding:18px;border-radius:15px;box-shadow:0 10px 35px #0008}.panel h2{margin:0 0 8px;color:#f8e5a7}.panel p{margin:0 0 14px}.meter{height:5px;background:#172b25;border-radius:4px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:#d6bc78;width:0%}@media(max-width:620px){main{padding:6px 8px 18px}header{padding:8px}.viewport canvas{width:720px;max-width:none}.viewport{max-height:55dvh}.tool{min-width:78px;padding:7px}.hint{font-size:12px}.stats{gap:8px}.controls button{padding:7px 9px}}@media(orientation:landscape) and (max-height:500px){header{padding:4px 12px}.viewport{max-height:54dvh}main{padding-top:2px}.toolbar{padding:5px 0}.hint{margin:3px 0;font-size:11px}}</style></head><body><header><div><small>HAMBONE ARCADE ORIGINAL</small><h1>Critter Rescue</h1></div><a href="/arcade/">← Arcade</a></header><main><div class="top"><div><select id="level" aria-label="Choose level"></select></div><div class="stats"><span>Rescued <strong id="saved">0</strong></span><span>Lost <strong id="lost">0</strong></span><span>Time <strong id="time">0</strong></span><span>Goal <strong id="goal">0</strong></span></div></div><div class="meter"><i id="meter"></i></div><div class="frame"><div class="viewport" id="viewport"><canvas id="world" width="960" height="480" aria-label="Woodland rescue puzzle. Use tools to alter the terrain."></canvas></div><div class="result" id="result" hidden><div class="panel"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="retry">Retry</button> <button id="next" class="primary">Next grove →</button></div></div></div><div class="toolbar" id="tools" aria-label="Rescue tools"></div>
