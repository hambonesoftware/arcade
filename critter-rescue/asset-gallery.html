<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Critter Rescue asset workshop</title><style>body{font-family:system-ui,sans-serif;background:#203b31;color:#f5e7c3;margin:24px}h1{font-family:Georgia,serif}a{color:#f3d08a}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}article{border:1px solid #8f9e7a;border-radius:12px;overflow:hidden;background:#355344}canvas{width:100%;display:block}h2{font-size:15px;padding:0 12px}p{color:#c9d3b5}.icons{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;padding:16px;background:#405a43;border-radius:12px}.icons div{display:grid;justify-items:center;gap:5px;font-size:12px}.icons svg{width:52px;height:52px}</style></head><body><a href="./index.html">Return to game</a><h1>Woodland asset workshop</h1><p>Original production illustrations, rendered under shared lighting for review.</p><div id="grid"></div><h2>Tool illustrations</h2><div class="icons" id="icons"></div><script type="module">
import {critter,burrow,stone,plant,mushroom,leaf,tools,toolIcon,palettes} from './assets.js';
const grid=document.querySelector('#grid'),cards=[];
function card(title,draw){let a=document.createElement('article'),canvas=document.createElement('canvas'),h=document.createElement('h2');canvas.width=320;canvas.height=180;h.textContent=title;a.append(canvas,h);grid.append(a);cards.push([canvas.getContext('2d'),draw]);}
card('Explorer — four coats',(c,t)=>{c.save();c.scale(2,2);for(let i=0;i<4;i++)critter(c,{x:2.1+i*3.2,y:5.2,id:i,dir:1,vy:0,block:false,glide:false},t);c.restore();});
card('Glider and guide',(c,t)=>{c.save();c.scale(3,3);critter(c,{x:2.6,y:4.5,id:0,dir:1,vy:3,block:false,glide:true},t);critter(c,{x:6.3,y:4.5,id:2,dir:1,vy:0,block:true,glide:false},t);c.restore();});
card('Home and nest burrows',(c,t)=>{c.save();c.scale(1.8,1.8);burrow(c,48,79,true,1);burrow(c,130,79,false,3);c.restore();});
card('Ferns and fungi',(c,t)=>{for(let i=0;i<4;i++){plant(c,35+i*80,130,2.2,i,t);mushroom(c,60+i*78,140,1.2,i);}});
card('Stone and leaf cushion',(c,t)=>{stone(c,30,66,100,63,3);stone(c,134,85,54,40,7);for(let i=0;i<6;i++)leaf(c,200+i*12,120-i%2*10,46,16,i*.24,'#a4be66');});
card('Grove palette samples',(c,t)=>{palettes.forEach((p,i)=>{let x=i*80;['sky','horizon','grass','soil','deep','water'].forEach((k,j)=>{c.fillStyle=p[k];c.fillRect(x,j*30,80,30);});});});
for(const t of tools){let d=document.createElement('div');d.innerHTML=toolIcon(t)+'<span>'+t.name+'</span>';document.querySelector('#icons').append(d);}
function frame(t){for(const [c,draw] of cards){let g=c.createLinearGradient(0,0,0,180);g.addColorStop(0,'#b8c8a0');g.addColorStop(1,'#668b70');c.fillStyle=g;c.fillRect(0,0,320,180);c.fillStyle='#788b50';c.fillRect(0,145,320,35);draw(c,t/1000);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
