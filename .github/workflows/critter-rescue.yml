name: Critter Rescue visual and interaction checks
on:
  pull_request:
    paths:
      - 'critter-rescue/**'
      - 'tests/critter-rescue*'
      - '.github/workflows/critter-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation and renderer regressions
        run: npm test
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium --only-shell
      - name: Test actual game in five viewport sizes
        run: node tests/critter-rescue-browser.mjs
      - name: Upload actual gameplay captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critter-rescue-gameplay-screenshots
          path: test-results/critter-rescue/
          if-no-files-found: warn
